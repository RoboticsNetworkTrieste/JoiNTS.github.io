<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TORC — Trieste Open Robotics Community</title>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;800&family=Red+Hat+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root { --forest:#08130F; --mint:#4FD1A0; --offwhite:#EAF2ED; }
    body { margin:0; min-height:100vh; display:grid; place-content:center;
           background:var(--forest); color:var(--offwhite);
           font-family:"Red Hat Display",sans-serif; text-align:center; padding:2rem; }
    h1 { font-size:clamp(3rem,12vw,7rem); font-weight:800; letter-spacing:-.03em; margin:0; }
    p  { font-family:"Red Hat Mono",monospace; font-size:.8rem; letter-spacing:.34em;
         text-transform:uppercase; color:var(--mint); margin-top:1.5rem; }
  </style>
</head>
<body>
  <h1>TORC</h1>
  <p>Trieste Open Robotics Community</p>
</body>
</html>
