<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{padding:24px}</style>
</head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const NS = window.JoiNTSDesignSystem_49bcd9;
const { Field, Input, Textarea, Select, Checkbox, Switch } = NS;
ReactDOM.createRoot(document.getElementById('root')).render(
  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24}}>
    <div style={{display:'flex',flexDirection:'column',gap:16}}>
      <Field label="Email" required hint="Non la condividiamo con nessuno.">
        <Input type="email" placeholder="nome@dominio.it" icon="mail" />
      </Field>
      <Field label="Repository" error="URL non valido.">
        <Input mono invalid defaultValue="github.com/joints" />
      </Field>
      <Field label="Ambito">
        <Select placeholder="Tutti gli ambiti" options={['SLAM','Manipolazione','Percezione','Controllo']} />
      </Field>
    </div>
    <div style={{display:'flex',flexDirection:'column',gap:16}}>
      <Field label="Cosa vuoi costruire">
        <Textarea rows={3} placeholder="Descrivi il problema e cosa vorresti provare…" />
      </Field>
      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        <Checkbox label="Voglio ricevere gli inviti ai meetup" defaultChecked />
        <Checkbox type="radio" name="r" label="Professionista" defaultChecked />
        <Checkbox type="radio" name="r" label="Studente" />
        <Checkbox label="Disabilitato" disabled />
        <Switch label="Mostra solo progetti attivi" defaultChecked />
      </div>
    </div>
  </div>
);
</script>
