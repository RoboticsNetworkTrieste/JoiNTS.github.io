name: Build and deploy join.ts.it

# Every push to main rebuilds the site and publishes it. Nothing is committed
# back — dist/ is an artifact, not a branch.
#
# One-time setup in the repository: Settings -> Pages -> Source = "GitHub Actions".
# Until that is switched over, this workflow builds successfully but the live
# site keeps being served from the branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a running one finish rather than cancelling
# it, so the live site is always a complete build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check nothing is missing from the build
        run: |
          for page in index manifesto/index progetti/index incontri/index entra/index officina/index; do
            test -s "dist/$page.html" || { echo "missing dist/$page.html"; exit 1; }
          done
          # The custom domain is served from the artifact, not from the branch.
          test -s dist/CNAME || { echo "missing dist/CNAME — is public/CNAME still there?"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
